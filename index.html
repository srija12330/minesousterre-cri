<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>minesousterre-cri</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #ffffff;
    --surface: #16262c;
    --surface-2: #1c323a;
    --border: #dfe4e7;
    --card-border: #2c4750;
    --text: #1c2a30;
    --text-dim: #64798a;
    --card-text: #edf2f2;
    --card-text-dim: #94aab0;
    --accent: #e5a916;
    --accent-2: #4e96ab;
    --mono: 'IBM Plex Mono', 'SF Mono', monospace;
    --disp: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'Inter', -apple-system, sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    visibility: hidden;
  }
  body.pret{ visibility: visible; }

  .hazard{
    height: 6px;
    background: repeating-linear-gradient(135deg, var(--accent), var(--accent) 10px, #143946 10px, #143946 20px);
  }

  header{
    padding: 22px 32px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header img{ height: 46px; background:#fff; padding:5px 10px; border-radius:5px; border:1px solid var(--border); }
  .deconnexion-btn{
    margin-left: auto;
    background: transparent;
    border: 1.5px solid var(--card-border);
    color: var(--text-dim);
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: var(--body);
  }
  .deconnexion-btn:hover{ border-color: var(--accent-2); color: var(--accent-2); }
  .brand-text .url{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .brand-text .name{
    font-family: var(--disp);
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    margin-top: 2px;
    line-height: 1.15;
  }
  .brand-text .sub{
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 1px;
  }

  main{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 64px;
    text-align: center;
  }

  .eyebrow{
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .cards{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
    max-width: 640px;
    width: 100%;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 36px 28px;
    text-decoration: none;
    color: var(--card-text);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(28,42,48,.10);
  }
  .card::before{
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--card-accent, var(--accent));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s ease;
  }
  .card:hover{
    transform: translateY(-3px);
    border-color: var(--card-accent, var(--accent));
    background: var(--surface-2);
  }
  .card:hover::before{ transform: scaleX(1); }

  .card .icon{
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--card-border);
  }
  .card .icon svg{ width: 28px; height: 28px; }

  .card .label{
    font-family: var(--disp);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .card .desc{
    font-size: 13px;
    color: var(--card-text-dim);
    line-height: 1.5;
  }

  .card.epi{ --card-accent: var(--accent-2); }
  .card.epi .icon svg{ stroke: var(--accent-2); }
  .card.camion .icon svg{ stroke: var(--accent); }

  .card.a-venir{
    cursor: default;
    opacity: .72;
  }
  .card.a-venir:hover{
    transform: none;
    background: var(--surface);
    border-color: var(--card-border);
  }
  .badge-venir{
    position: absolute;
    top: 14px;
    right: 14px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--card-text-dim);
    border: 1px solid var(--card-border);
    border-radius: 99px;
    padding: 3px 10px;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition: none; }
  }
</style>
</head>
<body>
  <div class="hazard"></div>
  <header>
    <img src="logo-cri.png" alt="Canadian Royalties inc.">
    <div class="brand-text">
      <div class="url">minesousterre-cri</div>
      <div class="name">Département Mine Sous-Terre</div>
      <div class="sub">Portail interne - Service administratif</div>
    </div>
    <button class="deconnexion-btn" onclick="deconnexionPortail()">Quitter</button>
  </header>

  <main>
    <div class="eyebrow">Choisir un outil</div>

    <div class="cards">
      <a class="card epi" href="./epi/index.html">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z"/>
          </svg>
        </div>
        <div class="label">EPI</div>
        <div class="desc">Inventaire, mouvements, employés et analyses de l'équipement de protection.</div>
      </a>

      <div class="card camion a-venir">
        <span class="badge-venir">À venir</span>
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 17h1a2 2 0 0 0 4 0h6a2 2 0 0 0 4 0h1v-4l-3-4h-4v8"/>
            <path d="M14 9V6H3a1 1 0 0 0-1 1v10h1"/>
            <circle cx="7.5" cy="17" r="1.6"/>
            <circle cx="17.5" cy="17" r="1.6"/>
          </svg>
        </div>
        <div class="label">Rapports Camion</div>
        <div class="desc">Saisie et scan des rapports camion, journal mensuel et export Excel.</div>
      </div>
    </div>
  </main>

<script>

const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJjb21ma2VjaHlydnJib3VyaGJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MTIxNjMsImV4cCI6MjA5OTM4ODE2M30.zwOslsZruNnap5TrBOIBUkhhROvxumEPeOqZ1oDcN4w';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function deconnexionPortail(){

</script>
</body>
</html>
