<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Département Mine Sous-Terre | mine.sous-terre.cri</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
  :root{
    /* Fond clair et épuré comme l'original, identité typographique du portail */
    --bg:#eff2f4;
    --surface:#ffffff;
    --surface-2:#f2f5f7;
    --border:#d7e0e5;
    --text:#1c2a30;
    --text-dim:#5b7282;
    --accent:#e5a916;
    --accent-hover:#c68f10;
    --accent-2:#305361;
    --mono:'IBM Plex Mono','SF Mono',monospace;
    --disp:'Barlow Condensed','Arial Narrow',sans-serif;
    --body:'Inter',-apple-system,sans-serif;
    /* Etats de stock */
    --vert:#1e8e3e;
    --vert-pale:#e6f4ea;
    --jaune:#a06a00;
    --jaune-pale:#fdf3df;
    --rouge:#b3261e;
    --rouge-pale:#fdecea;
    --gris:var(--text-dim);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--body);background:var(--bg);
    color:var(--text);visibility:hidden;padding-bottom:60px;
  }
  body.pret{visibility:visible}

  header{background:var(--surface);border-top:5px solid var(--accent);padding:12px 16px;border-bottom:1px solid var(--border)}
  header .head-int{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
  header .marque{display:flex;align-items:center;gap:14px;min-width:0}
  header .marque img{height:38px;width:auto;display:block}
  header .marque .app{border-left:2px solid var(--border);padding-left:14px;line-height:1.25}
  header .marque .app .url{font-family:var(--mono);font-size:10.5px;color:var(--accent-hover);letter-spacing:.4px;white-space:nowrap}
  header .marque .app .name{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.2px;text-transform:uppercase;color:var(--text);max-width:220px}
  header button{background:transparent;border:1.5px solid var(--border);color:var(--text-dim);padding:7px 13px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer}
  header button:hover{border-color:var(--accent-2);color:var(--accent-2)}
  @media(max-width:480px){header .marque img{height:30px}header .marque .app .name{font-size:12px;max-width:150px}}

  nav{background:var(--accent-2);position:sticky;top:0;z-index:50}
  nav .nav-int{max-width:820px;margin:0 auto;display:flex}
  nav button{flex:1;padding:15px 4px;border:none;background:none;cursor:pointer;font-size:15px;font-weight:700;color:rgba(255,255,255,.62);border-bottom:3px solid transparent}
  nav button.actif{color:#fff;border-bottom-color:var(--accent)}
  nav button:hover{color:#fff}

  main{max-width:820px;margin:0 auto;padding:14px 10px}
  section{display:none}
  section.actif{display:block}
  .bloc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(28,42,48,.06)}

  .barre{display:flex;gap:8px;margin-bottom:10px}
  .barre input{flex:1}
  input,select,textarea{
    width:100%;padding:12px;font-size:16px;border:2px solid var(--border);
    border-radius:8px;background:var(--surface-2);color:var(--text);font-family:inherit;
  }
  input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
  .filtres{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
  .filtres button{padding:8px 13px;border-radius:99px;border:2px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;color:var(--text-dim);cursor:pointer}
  .filtres button.actif{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
  .indicateur{font-size:12.5px;color:var(--text-dim);font-weight:600;margin-bottom:8px}

  .ligne-inv{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--border)}
  .ligne-inv .info{flex:1;min-width:0;cursor:pointer;padding:4px 2px;border-radius:6px}
  .ligne-inv .info:hover{background:var(--surface-2)}
  .ligne-inv .nom{font-size:14.5px;font-weight:600;line-height:1.25}
  .ligne-inv .meta{font-size:11.5px;color:var(--text-dim);font-weight:600;margin-top:1px}
  .ligne-inv .compte{font-family:var(--mono);font-size:20px;font-weight:700;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
  .compte.neg{color:var(--rouge)}
  .compte.bas{color:var(--jaune)}
  .ligne-inv .actions{display:flex;gap:6px}
  .ligne-inv .actions button{
    width:48px;height:48px;font-size:22px;font-weight:800;border-radius:9px;cursor:pointer;border:none;
  }
  .b-moins{background:var(--accent);color:var(--accent-2)}
  .b-moins:hover{background:var(--accent-hover)}
  .b-plus{background:var(--surface-2);color:var(--text-dim);border:2px solid var(--border) !important}
  .b-plus:hover{background:var(--border)}

  .pastille{display:inline-block;padding:2px 8px;border-radius:99px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;vertical-align:1px}
  .p-rupture{background:var(--rouge-pale);color:var(--rouge)}
  .p-bas{background:var(--jaune-pale);color:var(--jaune)}
  .p-inactif{background:var(--surface-2);color:var(--text-dim)}

  .ligne-emp{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer}
  .ligne-emp:hover{background:var(--surface-2)}
  .ligne-emp .qui{flex:1;font-size:15px;font-weight:600}
  .ligne-emp .qui .meta{font-size:12px;color:var(--text-dim);font-weight:600}
  .ligne-emp .cout{font-family:var(--mono);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .ligne-emp .pieces{font-size:12px;color:var(--text-dim);text-align:right;min-width:56px}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;padding:9px 8px;border-bottom:2px solid var(--border);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim)}
  td{padding:9px 8px;border-bottom:1px solid var(--border)}
  tr.cliquable{cursor:pointer}
  tr.cliquable:hover td{background:var(--surface-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

  .voile{display:none;position:fixed;inset:0;background:rgba(20,32,38,.5);z-index:100;align-items:flex-end;justify-content:center}
  .voile.ouvert{display:flex}
  .modale{background:var(--surface);width:100%;max-width:540px;border-radius:16px 16px 0 0;padding:20px 16px 28px;max-height:90vh;overflow-y:auto}
  @media(min-width:640px){.voile{align-items:center}.modale{border-radius:16px;padding:24px}}
  .modale h3{font-family:var(--disp);font-size:20px;font-weight:800;line-height:1.25;text-transform:uppercase;letter-spacing:.3px}
  .modale .sous{font-size:13px;color:var(--text-dim);margin:4px 0 14px}
  .modale label{display:block;font-size:13px;font-weight:700;margin:13px 0 6px}
  .modale-actions{display:flex;gap:10px;margin-top:18px}
  .btn-principal{width:100%;padding:15px;font-size:16px;font-weight:800;background:var(--accent);color:var(--accent-2);border:none;border-radius:9px;cursor:pointer}
  .btn-principal:hover{background:var(--accent-hover)}
  .btn-principal:disabled{opacity:.5;cursor:wait}
  .btn-second{padding:11px 15px;font-size:14px;font-weight:700;background:var(--surface);color:var(--text-dim);border:2px solid var(--border);border-radius:8px;cursor:pointer}
  .btn-second:hover{border-color:var(--accent-2);color:var(--accent-2)}
  .rangée{display:flex;gap:10px}
  .rangée > *{flex:1}

  .qte{display:flex;gap:8px}
  .qte button{width:60px;height:52px;font-size:24px;font-weight:800;border:2px solid var(--border);background:var(--surface-2);border-radius:8px;cursor:pointer;color:var(--text-dim)}
  .qte button:hover{background:var(--border)}
  .qte input{text-align:center;font-weight:800;font-size:20px}

  .auto{position:relative}
  .auto-liste{position:absolute;top:100%;left:0;right:0;z-index:140;background:var(--surface);border:2px solid var(--border);border-top:none;border-radius:0 0 10px 10px;max-height:230px;overflow-y:auto;box-shadow:0 12px 24px rgba(20,32,38,.15);display:none}
  .auto-liste div{padding:11px 13px;cursor:pointer;font-size:15px;border-bottom:1px solid var(--border)}
  .auto-liste div:hover{background:rgba(229,169,22,.12)}
  .auto-liste .meta{font-size:12px;color:var(--text-dim);font-weight:600}
  .auto-liste .nouveau{color:var(--accent-hover);font-weight:800}

  .journal-item{padding:10px 4px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:14px}
  .journal-item .detail{flex:1;line-height:1.35}
  .journal-item .detail .meta{font-size:12px;color:var(--text-dim)}
  .journal-item .suppr{background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;padding:6px}
  .journal-item .suppr:hover{color:var(--rouge)}
  .t-sortie{color:var(--rouge);font-weight:800}
  .t-ajout{color:var(--vert);font-weight:800}
  .t-ajust{color:var(--jaune);font-weight:800}
  .jour-titre{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent-2);text-transform:uppercase;letter-spacing:.06em;padding:14px 2px 4px;border-bottom:2px solid var(--border)}

  #toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);
    background:var(--accent-2);color:#fff;padding:13px 20px;border-radius:10px;
    font-size:15px;font-weight:700;z-index:300;transition:transform .25s;
    box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw;text-align:center;
  }
  #toast.visible{transform:translateX(-50%) translateY(0)}
  #toast.ok{background:var(--vert)}
  #toast.err{background:var(--rouge)}
  .vide{text-align:center;color:var(--text-dim);padding:26px 10px;font-size:14px}
</style>
</head>
<body>

<header>
  <div class="head-int">
    <div class="marque">
      <img src="../logo-cri.png" alt="Canadian Royalties inc.">
      <div class="app">
        <div class="url">mine.sous-terre.cri</div>
        <div class="name">Département Mine Sous-Terre</div>
      </div>
    </div>
    <button onclick="location.href='../index.html'">← Portail</button>
  </div>
</header>

<nav>
  <div class="nav-int">
    <button class="actif" data-onglet="inventaire" onclick="onglet('inventaire')">Inventaire</button>
    <button data-onglet="mouvements" onclick="onglet('mouvements')">Mouvements</button>
    <button data-onglet="employes" onclick="onglet('employes')">Employés</button>
    <button data-onglet="analyses" onclick="onglet('analyses')">Analyses</button>
  </div>
</nav>

<main>

<!-- ================= INVENTAIRE (l'écran principal) ================= -->
<section id="inventaire" class="actif">
  <div class="bloc">
    <div class="barre">
      <input id="k-recherche" placeholder="Chercher un article…" oninput="rendreInventaire()">
      <button class="btn-second" style="flex:0 0 auto;white-space:nowrap" onclick="ouvrirNouvelArticle()">＋ Article</button>
      <button class="btn-second" style="flex:0 0 auto;white-space:nowrap" id="k-export" onclick="exporterInventaire()">⬇ Excel</button>
    </div>
    <div class="filtres">
      <button class="actif" data-f="TOUS" onclick="filtreInv('TOUS')">Tous</button>
      <button data-f="RUPTURE" onclick="filtreInv('RUPTURE')">Rupture</button>
      <button data-f="BAS" onclick="filtreInv('BAS')">Bas</button>
    </div>
    <div class="indicateur" id="k-sommaire"></div>
    <div id="k-liste"></div>
  </div>
</section>

<!-- ================= MOUVEMENTS ================= -->
<section id="mouvements">
  <div class="bloc">
    <div class="barre">
      <input id="m-recherche" placeholder="Article, employé, commentaire…" oninput="rendreMouvements()">
    </div>
    <div class="rangée" style="margin-bottom:10px">
      <div>
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:5px">Du</label>
        <input type="date" id="m-du" onchange="MVT_LIMITE=50;rendreMouvements()">
      </div>
      <div>
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:5px">Au</label>
        <input type="date" id="m-au" onchange="MVT_LIMITE=50;rendreMouvements()">
      </div>
      <button class="btn-second" style="flex:0 0 auto;align-self:flex-end" onclick="effacerDatesMvt()">Effacer</button>
    </div>
    <div class="filtres">
      <button class="actif" data-f="TOUS" onclick="filtreMvt('TOUS')">Tous</button>
      <button data-f="SORTIE" onclick="filtreMvt('SORTIE')">Sorties</button>
      <button data-f="AJOUT" onclick="filtreMvt('AJOUT')">Réceptions</button>
      <button data-f="AJUSTEMENT" onclick="filtreMvt('AJUSTEMENT')">Ajustements</button>
    </div>
    <div class="indicateur" id="m-sommaire"></div>
    <button class="btn-second" style="width:100%;margin-bottom:10px" id="m-export" onclick="exporterMouvements()">⬇ Exporter l'historique en Excel</button>
    <div id="m-liste"><div class="vide">Chargement…</div></div>
    <button class="btn-second" style="width:100%;margin-top:12px;display:none" id="m-plus" onclick="chargerPlusMouvements()">Afficher plus</button>
  </div>
</section>

<!-- ================= EMPLOYÉS ================= -->
<section id="employes">
  <div class="bloc">
    <div class="barre">
      <input id="e-recherche" placeholder="Chercher un employé…" oninput="rendreEmployes()">
      <button class="btn-second" style="flex:0 0 auto;white-space:nowrap" onclick="ouvrirNouvelEmploye()">＋ Employé</button>
    </div>
    <div class="filtres">
      <button class="actif" data-f="ACTIFS" onclick="filtreEmp('ACTIFS')">Actifs</button>
      <button data-f="INACTIFS" onclick="filtreEmp('INACTIFS')">Inactifs</button>
      <button data-f="TOUS" onclick="filtreEmp('TOUS')">Tous</button>
    </div>
    <div class="indicateur" id="e-sommaire"></div>
    <button class="btn-second" style="width:100%;margin-bottom:10px" id="e-export" onclick="exporterEmployes()">⬇ Exporter le détail par personne en Excel</button>
    <div id="e-liste"><div class="vide">Chargement…</div></div>
  </div>
</section>

<!-- ================= ANALYSES ================= -->
<section id="analyses">
  <div class="bloc">
    <div class="rangée">
      <div>
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:6px">Vue</label>
        <select id="a-vue" onchange="rendreAnalyse()">
          <option value="mois">Par mois</option>
          <option value="poste">Par poste</option>
          <option value="personne">Par personne</option>
          <option value="article">Par article</option>
        </select>
      </div>
      <div>
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:6px">Du</label>
        <input type="date" id="a-du" onchange="rendreAnalyse()">
      </div>
      <div>
        <label style="display:block;font-size:13px;font-weight:700;margin-bottom:6px">Au</label>
        <input type="date" id="a-au" onchange="rendreAnalyse()">
      </div>
    </div>
    <button class="btn-second" style="width:100%;margin-top:12px" id="a-export" onclick="exporterExcel()">⬇ Exporter en Excel</button>
  </div>
  <div class="bloc" style="overflow-x:auto">
    <div id="a-table"><div class="vide">Chargement…</div></div>
  </div>
</section>

</main>

<div class="voile" id="voile" onclick="if(event.target===this)fermerModale()">
  <div class="modale" id="modale-contenu"></div>
</div>

<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
