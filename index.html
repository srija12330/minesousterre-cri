<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>minesousterre-cri</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #ffffff;
    --surface: #16262c;
    --surface-2: #1c323a;
    --border: #dfe4e7;
    --card-border: #2c4750;
    --text: #1c2a30;
    --text-dim: #64798a;
    --card-text: #edf2f2;
    --card-text-dim: #94aab0;
    --accent: #e5a916;
    --accent-2: #4e96ab;
    --mono: 'IBM Plex Mono', 'SF Mono', monospace;
    --disp: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'Inter', -apple-system, sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .hazard{
    height: 6px;
    background: repeating-linear-gradient(135deg, var(--accent), var(--accent) 10px, #143946 10px, #143946 20px);
  }

  header{
    padding: 22px 32px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header img{ height: 46px; background:#fff; padding:5px 10px; border-radius:5px; border:1px solid var(--border); }
  .brand-text .url{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .brand-text .name{
    font-family: var(--disp);
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    margin-top: 2px;
    line-height: 1.15;
  }
  .brand-text .sub{
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 1px;
  }

  main{
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px 64px;
    text-align: center;
  }

  .eyebrow{
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-dim);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .cards{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
    max-width: 640px;
    width: 100%;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 36px 28px;
    text-decoration: none;
    color: var(--card-text);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(28,42,48,.10);
  }
  .card::before{
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--card-accent, var(--accent));
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.2s ease;
  }
  .card:hover{
    transform: translateY(-3px);
    border-color: var(--card-accent, var(--accent));
    background: var(--surface-2);
  }
  .card:hover::before{ transform: scaleX(1); }

  .card .icon{
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--card-border);
  }
  .card .icon svg{ width: 28px; height: 28px; }

  .card .label{
    font-family: var(--disp);
    font-weight: 800;
    font-size: 22px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .card .desc{
    font-size: 13px;
    color: var(--card-text-dim);
    line-height: 1.5;
  }

  .card.epi{ --card-accent: var(--accent-2); }
  .card.epi .icon svg{ stroke: var(--accent-2); }
  .card.camion .icon svg{ stroke: var(--accent); }

  .card.a-venir{
    cursor: default;
    opacity: .72;
  }
  .card.a-venir:hover{
    transform: none;
    background: var(--surface);
    border-color: var(--card-border);
  }
  .badge-venir{
    position: absolute;
    top: 14px;
    right: 14px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--card-text-dim);
    border: 1px solid var(--card-border);
    border-radius: 99px;
    padding: 3px 10px;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition: none; }
  }
</style>
